spring.datasource.url=jdbc:postgresql://localhost:5434/order_system
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

resilience4j.retry.instances.paymentRetry.max-attempts=3
resilience4j.retry.instances.paymentRetry.wait-duration=1s
resilience4j.retry.instances.paymentRetry.enable-exponential-backoff=true
resilience4j.retry.instances.paymentRetry.exponential-backoff-multiplier=2

resilience4j.circuitbreaker.instances.paymentCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.wait-duration-in-open-state=10s

resilience4j.timelimiter.instances.paymentTimeout.timeout-duration=3s
resilience4j.timelimiter.instances.paymentTimeout.cancel-running-future=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

payment.simulate-failure=false
payment.simulate-timeout=false
payment.simulate-timeout-ms=5000

order.simulate-crash-after-payment=false