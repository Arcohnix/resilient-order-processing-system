spring.datasource.url=jdbc:h2:mem:order_system_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

payment.simulate-failure=false
payment.simulate-timeout=false
payment.simulate-timeout-ms=5000

order.simulate-crash-after-payment=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false

management.endpoints.web.exposure.include=health,metrics,prometheus

resilience4j.retry.instances.paymentRetry.wait-duration=100ms
resilience4j.retry.instances.paymentRetry.enable-exponential-backoff=false
